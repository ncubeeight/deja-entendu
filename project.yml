# XcodeGen spec for Déjà Entendu.
# Regenerates the SAME "Déjà Entendu.xcodeproj" you already created — this
# overwrites the stock template's project file, not the source folders
# (your old ContentView.swift/Item.swift stay on disk but are no longer
# part of the build since they're not listed under `sources:` below).
#
# One-time tool install (Terminal, on your Mac):
#   brew install xcodegen
#
# Then, from this folder:
#   xcodegen generate
#   open "Déjà Entendu.xcodeproj"
#
# One thing NOT set here: DEVELOPMENT_TEAM. Your existing project didn't
# have one selected yet, so after generating, open Signing & Capabilities
# in Xcode for BOTH targets and pick your Team from the dropdown.

name: Déjà Entendu

options:
  bundleIdPrefix: com.ncubeeight.dejaentendu
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en

settingGroups:
  signing:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9Q3FCK2997

targets:
  Déjà Entendu:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Déjà Entendu"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSpeechRecognitionUsageDescription: "Used to transcribe your Mandarin practice recordings on-device."
        NSMicrophoneUsageDescription: "Used to record your Mandarin practice sessions."
    entitlements:
      path: App/DejaEntendu.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ncubeeight.dejaentendu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncubeeight.dejaentendu
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
      groups: [signing]
    dependencies:
      - target: AddToDejaEntendu
        embed: true

  AddToDejaEntendu:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Add to Déjà Entendu"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    entitlements:
      path: ShareExtension/AddToDejaEntendu.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ncubeeight.dejaentendu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncubeeight.dejaentendu.share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
      groups: [signing]

schemes:
  Déjà Entendu:
    build:
      targets:
        Déjà Entendu: all
    run:
      config: Debug
    archive:
      config: Release
